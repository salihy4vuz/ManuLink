version: '3.8'

services:
  # -------------------------
  # 1. Reverse Proxy (Gateway)
  # -------------------------
  nginx:
    image: docker.io/library/nginx:alpine
    container_name: sheetmetal-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - main-api
    networks:
      - sheetmetal-network
    restart: unless-stopped

  # -------------------------
  # 2. Frontend (Vue 3)
  # -------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: sheetmetal-frontend
    networks:
      - sheetmetal-network
    restart: unless-stopped
    # Ports not exposed directly; Nginx handles it

  # -------------------------
  # 3. Main API (Golang Gateway)
  # -------------------------
  main-api:
    build:
      context: ./services/main-api
      dockerfile: Dockerfile
    container_name: sheetmetal-main-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sheetmetal-network
    restart: unless-stopped

  # -------------------------
  # 4. Geometry & CAM Engine (Rust)
  # -------------------------
  geometry-engine:
    build:
      context: ./services/geometry-engine
      dockerfile: Dockerfile
    container_name: sheetmetal-geometry-engine
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - sheetmetal-network
    restart: unless-stopped

  # -------------------------
  # 5. Database (PostgreSQL)
  # -------------------------
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: sheetmetal-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sheetmetal-network
    ports:
      - "5432:5432" # Optional for local dev/admin tools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------------
  # 6. Message Queue (RabbitMQ)
  # -------------------------
  rabbitmq:
    image: docker.io/library/rabbitmq:3-management-alpine
    container_name: sheetmetal-rabbitmq
    env_file:
      - .env
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sheetmetal-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # -------------------------
  # 7. Object Storage (MinIO)
  # -------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: sheetmetal-minio
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web UI
    volumes:
      - minio_data:/data
    networks:
      - sheetmetal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------------
  # 8. Cache (Redis) — FAZ 12 / 18.1
  # -------------------------
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: sheetmetal-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sheetmetal-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# -------------------------
# Volumes & Networks
# -------------------------
networks:
  sheetmetal-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  redis_data:

