server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router desteği (History mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik dosyalar için önbellek (Cache)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|glb|gltf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
