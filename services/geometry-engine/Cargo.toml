[package]
name = "geometry-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.44", features = ["full"] }
lapin = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-lite = "2.6"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
deadpool-lapin = "0.12.1"
regex = "1.11"
