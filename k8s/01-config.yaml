apiVersion: v1
kind: ConfigMap
metadata:
  name: sheetmetal-config
  namespace: default
data:
  POSTGRES_DB: "sheetmetal_b2b"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  MINIO_URL: "minio:9000"
  MINIO_BUCKET: "cad-files"
  API_PORT: "3000"
  ALLOWED_ORIGINS: "http://localhost"
  ENABLE_TELEMETRY: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: sheetmetal-secrets
  namespace: default
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "guest"
  MINIO_ROOT_USER: "admin"
  MINIO_ROOT_PASSWORD: "password123"
  JWT_SECRET: "super-secret-key-123"
