---
# Faz 5.7.9: Distributed Storage (Longhorn)
# Example StorageClass. Requires Longhorn to be installed: helm install longhorn longhorn/longhorn -n longhorn-system --create-namespace

kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "2880" # 48 hours in minutes
  fromBackup: ""
  fsType: "ext4"
reclaimPolicy: Retain
