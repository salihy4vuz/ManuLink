apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sma-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m" # CAD upload için
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://b2b.sheetmetalapex.com"
spec:
  tls:
  - hosts:
    - app.sheetmetalapex.com
    - api.sheetmetalapex.com
    secretName: sma-tls-secret
  rules:
  - host: app.sheetmetalapex.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  - host: api.sheetmetalapex.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: main-api
            port:
              number: 3000
