# Faz 5.9.8: Virtual Clusters (vcluster for Multi-Tenancy)
# A definition for a vcluster to isolate a large B2B enterprise customer
# Required vcluster CLI to deploy: vcluster create b2b-customer-a -f 34-vcluster.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: vcluster-b2b-customer-a
---
