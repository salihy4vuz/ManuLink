apiVersion: apps/v1
kind: Deployment
metadata:
  name: sheet-metal-frontend
  labels:
    app: sheet-metal-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sheet-metal-frontend
  template:
    metadata:
      labels:
        app: sheet-metal-frontend
    spec:
      containers:
        - name: frontend
          image: "ghcr.io/salihy4vuz/sheetmetal-frontend:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
