apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: geometry-engine-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sheet-metal-geometry-engine
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
