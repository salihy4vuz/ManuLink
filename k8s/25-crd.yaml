---
# Faz 5.8.8: Custom CRD for Sheet Metal Projects
# Defines a custom resource in Kubernetes for a sheet metal order

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sheetmetalprojects.sacmetal.com
spec:
  group: sacmetal.com
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                material:
                  type: string
                thickness:
                  type: number
                kFactor:
                  type: number
  scope: Namespaced
  names:
    plural: sheetmetalprojects
    singular: sheetmetalproject
    kind: SheetMetalProject
    shortNames:
    - smp
