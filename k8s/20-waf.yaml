---
# Faz 5.8.3: Web Application Firewall (Coraza WAF / Ingress configuration)
# Requires ingress-nginx configured with ModSecurity or Coraza module.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-api-waf-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Enable ModSecurity WAF protection for this Ingress
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyAccess On
      SecAuditEngine RelevantOnly
      SecAuditLogParts ABIJDEFHZ
spec:
  rules:
  - host: api.sacmetal-automation.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: main-api
            port:
              number: 3000
